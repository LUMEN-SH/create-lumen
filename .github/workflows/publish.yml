name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: node --import ./register.js --test "tests/unit/*.test.mjs"

      - name: Determine publish eligibility
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *beta*|*alpha*)
              echo "publishable=false" >> "$GITHUB_OUTPUT"
              echo "::notice::create-lumen@$VERSION is a pre-release (beta/alpha); npm publish skipped."
              ;;
            *)
              if npm view "create-lumen@$VERSION" version >/dev/null 2>&1; then
                echo "publishable=false" >> "$GITHUB_OUTPUT"
                echo "::notice::create-lumen@$VERSION is already published on npm; publish skipped."
              else
                echo "publishable=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

      - name: Publish stable release to npm
        if: steps.check.outputs.publishable == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}